name: Publish Runtime Images

on:
  push:
    branches: [ "main", "develop" ]
  schedule:
    - cron: '0 0 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-backend-images:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: alpine
            dockerfile: ./Dockerfile
            tags: |
              ghcr.io/inventas/laravel-base:latest
              ghcr.io/inventas/laravel-base:alpine
              ghcr.io/inventas/laravel-base:8.5.12-alpine
          - variant: debian
            dockerfile: ./Dockerfile.debian
            tags: |
              ghcr.io/inventas/laravel-base:debian
              ghcr.io/inventas/laravel-base:8.5.12-debian
    steps:
      - name: 'Checkout GitHub Repository'
        uses: actions/checkout@v4
      - name: "Build ${{ matrix.variant }} image"
        uses: serversideup/github-action-docker-build@v5
        with:
          tags: ${{ matrix.tags }}
          dockerfile: ${{ matrix.dockerfile }}
          registry: "ghcr.io"
          registry-username: ${{ github.actor }}
          registry-token: "${{ secrets.GITHUB_TOKEN }}"
          platforms: "linux/amd64,linux/arm64"
